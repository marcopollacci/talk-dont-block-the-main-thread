<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The REAL heavy task 🤖 — live demo</title>
    <style>
      /* Palette coerente col deck:
     main-gradient      #c850c0 → #4158d0  (worker / titoli)
     main-sub-gradient  #ff00d8 → #ff542f  (main thread / "hot") */
      :root {
        --grad-main: linear-gradient(90deg, #c850c0, #4158d0);
        --grad-sub: linear-gradient(90deg, #ff00d8, #ff542f);
        --ink: #2b2b33;
        --muted: #8a8a99;
        --line: #e4e4ee;
        --bg: #ffffff;
        --ok: #14b86a;
        --bad: #ff3860;
        --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      /* ============ IL BOX ============ */
      .demo-box {
        width: min(96vw, 1180px);
        border: 1px solid var(--line);
        border-radius: 1.2rem;
        box-shadow: 0 1rem 3rem rgba(65, 88, 208, 0.1);
        padding: clamp(1rem, 2.5vh, 2rem) clamp(1.2rem, 3vw, 2.5rem);
        display: grid;
        gap: clamp(0.8rem, 2vh, 1.4rem);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.3rem, 3.2vw, 2.1rem);
        text-align: center;
      }
      .grad-main,
      .grad-sub {
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .grad-main {
        background-image: var(--grad-main);
      }
      .grad-sub {
        background-image: var(--grad-sub);
      }

      /* ============ MAIN-THREAD-O-METRO ============ */
      .meter {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 1.2rem;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 0.9rem 1.2rem;
      }
      .track {
        height: clamp(2.4rem, 6vh, 3.2rem);
        border-radius: 999px;
        background: #f4f4fa;
        position: relative;
        overflow: hidden;
      }
      .ball {
        position: absolute;
        inset-block-start: 50%;
        translate: 0 -50%;
        inline-size: clamp(1.8rem, 5vh, 2.5rem);
        block-size: clamp(1.8rem, 5vh, 2.5rem);
        border-radius: 50%;
        background: var(--grad-main);
      }
      .fps {
        font-family: var(--mono);
        font-size: clamp(1.2rem, 3vw, 1.8rem);
        font-weight: 700;
        min-width: 4.5em;
        text-align: end;
      }
      .fps.good {
        color: var(--ok);
      }
      .fps.bad {
        color: var(--bad);
      }
      .clicker {
        font: inherit;
        font-size: clamp(1rem, 2.2vw, 1.3rem);
        font-weight: 700;
        border: 2px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 0.8rem;
        padding: 0.5em 1em;
        cursor: pointer;
      }
      .clicker:active {
        scale: 0.96;
      }

      /* ============ I DUE CONTENDENTI ============ */
      .arena {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(1rem, 2.5vw, 2rem);
      }
      .side {
        border: 2px solid var(--line);
        border-radius: 1rem;
        padding: clamp(0.9rem, 2vh, 1.4rem);
        display: grid;
        gap: 0.7rem;
        align-content: start;
        text-align: center;
      }
      .side h2 {
        margin: 0;
        font-size: clamp(1.1rem, 2.6vw, 1.6rem);
      }
      .side .hint {
        color: var(--muted);
        font-size: clamp(0.75rem, 1.6vw, 0.95rem);
        margin: 0;
      }
      .run {
        font: inherit;
        font-size: clamp(1rem, 2.4vw, 1.4rem);
        font-weight: 700;
        color: #fff;
        border: none;
        border-radius: 0.8rem;
        padding: 0.7em 1em;
        cursor: pointer;
      }
      .run:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .side.main .run {
        background: var(--grad-sub);
      }
      .side.worker .run {
        background: var(--grad-main);
      }
      .result {
        font-family: var(--mono);
        font-size: clamp(1rem, 2.4vw, 1.5rem);
        font-weight: 700;
        min-height: 1.4em;
      }
      .result .ms {
        font-size: 0.7em;
        color: var(--muted);
        font-weight: 400;
      }

      /* ============ STATUS BAR ============ */
      .status {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        font-size: clamp(0.75rem, 1.6vw, 0.95rem);
        color: var(--muted);
        font-family: var(--mono);
      }
      .status progress {
        flex: 1;
        accent-color: #c850c0;
        height: 0.5rem;
      }
      select {
        font: inherit;
        font-family: var(--mono);
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        padding: 0.15em 0.4em;
        background: #fff;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="demo-box">
      <h1>
        <span class="grad-sub">Main thread</span> vs
        <span class="grad-main">Worker</span>
      </h1>

      <!-- ============ MAIN-THREAD-O-METRO (rAF, NON CSS!) ============ -->
      <div class="meter">
        <div class="track"><div class="ball" id="ball"></div></div>
        <div class="fps good" id="fps">-- fps</div>
        <button class="clicker" id="clicker">
          click me! <span id="clickCount">0</span>
        </button>
      </div>

      <!-- ============ ARENA ============ -->
      <div class="arena">
        <div class="side main">
          <h2>💀 <span class="grad-sub">Main thread</span></h2>
          <p class="hint">same model, same batch — press [1]</p>
          <button class="run" id="runMain" disabled>Run inference</button>
          <div class="result" id="resMain">&nbsp;</div>
        </div>
        <div class="side worker">
          <h2>⚙️ <span class="grad-main">Web Worker</span></h2>
          <p class="hint">same model, same batch — press [2]</p>
          <button class="run" id="runWorker" disabled>Run inference</button>
          <div class="result" id="resWorker">&nbsp;</div>
        </div>
      </div>

      <!-- ============ STATUS ============ -->
      <div class="status">
        <span id="statusText">loading model…</span>
        <progress id="progress" max="100" value="0"></progress>
        <label
          >batch
          <select id="batch">
            <option value="32">32</option>
            <option value="64">64</option>
            <option value="128" selected>128</option>
            <option value="256">256</option>
          </select>
        </label>
      </div>
    </div>

    <script type="module">
      const MODEL = "Xenova/distilbert-base-uncased-finetuned-sst-2-english";
      const CDN =
        "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";
      const TEXT = "The main thread is finally free, I love web workers!";

      const $ = (id) => document.getElementById(id);

      /* =========================================================
   MAIN-THREAD-O-METRO — pallina + fps via requestAnimationFrame.
   Volutamente JS-driven: una animazione CSS girerebbe sul
   compositor thread e resterebbe fluida anche col main bloccato.
   ========================================================= */
      const ball = $("ball");
      const fpsEl = $("fps");
      let frames = 0;
      let fpsWindowStart = performance.now();

      function tick(now) {
        const track = ball.parentElement.clientWidth - ball.clientWidth - 10;
        const x = ((Math.sin(now / 500) + 1) / 2) * track + 5;
        ball.style.transform = `translateX(${x}px)`;

        frames++;
        if (now - fpsWindowStart >= 500) {
          const fps = Math.round(frames / ((now - fpsWindowStart) / 1000));
          fpsEl.textContent = `${fps} fps`;
          fpsEl.className = "fps " + (fps < 30 ? "bad" : "good");
          frames = 0;
          fpsWindowStart = now;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      let clicks = 0;
      $("clicker").addEventListener("click", () => {
        $("clickCount").textContent = ++clicks;
      });

      /* ============ progress condivisa ============ */
      function onProgress(p) {
        if (p.status === "progress" && p.file?.endsWith(".onnx")) {
          $("progress").value = p.progress ?? 0;
        }
      }
      const batchTexts = () => Array(+$("batch").value).fill(TEXT);
      const show = (el, label, score, ms) => {
        el.innerHTML = `${label === "POSITIVE" ? "😊" : "😠"} ${label} <span class="ms">· ${ms}ms</span>`;
      };

      /* =========================================================
   MAIN THREAD
   ========================================================= */
      let mainClassifier = null;

      async function runMain() {
        $("resMain").textContent = "crunching… 👀";
        // un frame di respiro così il testo si vede PRIMA del blocco
        await new Promise((r) => requestAnimationFrame(() => setTimeout(r)));
        const t0 = performance.now();
        const out = await mainClassifier(batchTexts());
        const ms = Math.round(performance.now() - t0);
        show($("resMain"), out[0].label, out[0].score, ms);
      }

      /* =========================================================
   WORKER — module worker da Blob, così resta tutto in un file
   ========================================================= */
      const workerSrc = `
  import { pipeline } from '${CDN}';
  let classifier = null;

  self.onmessage = async ({ data }) => {
    if (data.type === 'load') {
      classifier = await pipeline('sentiment-analysis', '${MODEL}', { dtype: 'q8' });
      self.postMessage({ type: 'ready' });
    }
    if (data.type === 'run') {
      const t0 = performance.now();
      const out = await classifier(data.texts);
      self.postMessage({ type: 'result', ms: Math.round(performance.now() - t0), first: out[0] });
    }
  };
`;
      const worker = new Worker(
        URL.createObjectURL(new Blob([workerSrc], { type: "text/javascript" })),
        { type: "module" },
      );
      worker.onmessage = ({ data }) => {
        if (data.type === "ready") workerReady();
        if (data.type === "result")
          show($("resWorker"), data.first.label, data.first.score, data.ms);
      };

      function runWorker() {
        $("resWorker").textContent = "crunching… 😎";
        worker.postMessage({ type: "run", texts: batchTexts() });
      }

      /* =========================================================
   BOOT — carica tutto all'apertura della pagina.
   Aprila PRIMA del talk: il download (~65MB) riempie la cache,
   sul palco ricarica dalla cache in un paio di secondi.
   ========================================================= */
      let readyCount = 0;
      function workerReady() {
        if (++readyCount === 2) {
          $("statusText").textContent = "ready 🍿 — [1] main · [2] worker";
          $("progress").value = 100;
          $("runMain").disabled = false;
          $("runWorker").disabled = false;
        }
      }

      (async () => {
        try {
          const { pipeline } = await import(CDN);
          worker.postMessage({ type: "load" });
          mainClassifier = await pipeline("sentiment-analysis", MODEL, {
            dtype: "q8",
            progress_callback: onProgress,
          });
          workerReady();
        } catch (err) {
          $("statusText").textContent =
            `error: ${err.message} — serve the page over HTTP!`;
        }
      })();

      /* ============ scorciatoie da palco ============ */
      document.addEventListener("keydown", (e) => {
        if (e.key === "1" && !$("runMain").disabled) runMain();
        if (e.key === "2" && !$("runWorker").disabled) runWorker();
        if (e.key.toLowerCase() === "r") {
          clicks = 0;
          $("clickCount").textContent = 0;
        }
      });
      $("runMain").addEventListener("click", runMain);
      $("runWorker").addEventListener("click", runWorker);
    </script>
  </body>
</html>
